name: Release

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'
            - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Read changelog entry
              id: changelog
              uses: mindsers/changelog-reader-action@v2.4.0
              with:
                  version: ${{ github.ref_name }}

            - name: Create release
              uses: softprops/action-gh-release@v3.0.4
              with:
                  name: ${{ github.ref_name }}
                  body_path: ${{ steps.changelog.outputs.changes_file }}
                  prerelease: ${{ steps.changelog.outputs.status == 'prereleased' }}
